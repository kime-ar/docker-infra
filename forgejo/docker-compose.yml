networks:
  edge:
    external: true
  # Red aislada para los jobs de CI: pueden clonar de Forgejo y salir a internet,
  # pero NO alcanzan a Postgres/Redis/MinIO ni al resto de la infraestructura.
  ci-jobs:
    name: ci-jobs
    driver: bridge

services:
  server:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__security__INTERNAL_TOKEN=${FORGEJO_INTERNAL_TOKEN:?Definí FORGEJO_INTERNAL_TOKEN en .env}
      - FORGEJO__oauth2__JWT_SECRET=${FORGEJO_JWT_SECRET:?Definí FORGEJO_JWT_SECRET en .env}
      - FORGEJO__server__LFS_JWT_SECRET=${FORGEJO_LFS_JWT_SECRET:?Definí FORGEJO_LFS_JWT_SECRET en .env}
      - FORGEJO__mailer__PASSWD=${FORGEJO_SMTP_PASSWD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ../data/forgejo:/data
      - ${FORGEJO_GIT_STORAGE:?Definí FORGEJO_GIT_STORAGE en .env}:/data/git
    ports:
      - "2323:22"
    networks:
      - edge      # Caddy proxya git.garatortiz.xyz; también da egress (SMTP, mirrors)
      - ci-jobs   # los jobs de CI necesitan clonar vía http://forgejo:3000

  runner:
    image: code.forgejo.org/forgejo/runner:6.3.1
    container_name: forgejo-runner
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 256M
    networks:
      - ci-jobs
    environment:
      # Nota: con config.yaml presente, container.network del archivo es lo que
      # gobierna; esta variable queda como respaldo coherente.
      - ACTIONS_RUNNER_CONTAINER_NETWORK=ci-jobs
      - GITEA_RUNNER_REGISTRATION_TOKEN=${FORGEJO_RUNNER_TOKEN:?Definí FORGEJO_RUNNER_TOKEN en .env}
    command: sh -c "forgejo-runner register --no-interactive --instance http://forgejo:3000 --token $${GITEA_RUNNER_REGISTRATION_TOKEN} --name kime-ubuntu-runner --labels ubuntu-latest:docker://node:20-bullseye,ubuntu-22.04:docker://ubuntu:22.04 || true && forgejo-runner daemon --config /data/config.yaml"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./runner-data:/data
