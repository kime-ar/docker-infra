networks:
  dev-network:
    external: true

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../data/caddy:/data
      - ../data/caddy_config:/config
    networks:
      - dev-network
