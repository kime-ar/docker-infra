networks:
  edge:
    external: true

volumes:
  caddy_data:
    name: docker-infra_caddy_data
    external: true
  caddy_config:
    name: docker-infra_caddy_config
    external: true

services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?Definí CLOUDFLARE_API_TOKEN en .env}
      - HOST_IP=${HOST_IP:-192.168.100.111}
      - N8N_CORS_ORIGIN=${N8N_CORS_ORIGIN:-https://n8n.garatortiz.xyz}
      - RELEASE_DASHBOARD_USER=${RELEASE_DASHBOARD_USER:?Definí RELEASE_DASHBOARD_USER en .env}
      - RELEASE_DASHBOARD_PASSWORD_HASH=${RELEASE_DASHBOARD_PASSWORD_HASH:?Definí RELEASE_DASHBOARD_PASSWORD_HASH en .env}
      - RADAR84_USER=${RADAR84_USER:?Definí RADAR84_USER en .env}
      - RADAR84_PASSWORD_HASH=${RADAR84_PASSWORD_HASH:?Definí RADAR84_PASSWORD_HASH en .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # Aliases para que contenedores en edge resuelvan *.garatortiz.xyz
        # hacia Caddy (si el DNS de Cloudflare apunta a la IP LAN del host,
        # dentro de un contenedor a veces no llega bien; Docker DNS sí).
        aliases:
          - s3.garatortiz.xyz
          - minio.garatortiz.xyz
          - home.garatortiz.xyz
          - status.garatortiz.xyz
          - n8n.garatortiz.xyz
          - docker.garatortiz.xyz
          - ai.garatortiz.xyz
          - mail.garatortiz.xyz
          - sonar.garatortiz.xyz
          - git.garatortiz.xyz
          - releases.garatortiz.xyz
          - radar84.garatortiz.xyz
          - cal.garatortiz.xyz
          - cal-api.garatortiz.xyz
