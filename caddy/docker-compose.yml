networks:
  edge:
    external: true

volumes:
  caddy_data:
    name: docker-infra_caddy_data
    external: true
  caddy_config:
    name: docker-infra_caddy_config
    external: true

services:
  caddy:
    build: .
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 64M
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?Definí CLOUDFLARE_API_TOKEN en .env}
      - HOST_IP=${HOST_IP:-192.168.100.111}
      - N8N_CORS_ORIGIN=${N8N_CORS_ORIGIN:-https://n8n.kime.lan}
    healthcheck:
      # La API admin escucha en 127.0.0.1:2019 (evitar localhost → IPv6)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        # Aliases para que los contenedores de edge (Langfuse, Uptime Kuma,
        # Homepage) resuelvan los dominios locales hacia Caddy vía Docker DNS;
        # el DNS de la LAN los apunta a 127.0.0.1 y dentro de un contenedor
        # eso no sirve.
        aliases:
          - s3.kime.lan
          - minio.kime.lan
          - home.kime.lan
          - status.kime.lan
          - n8n.kime.lan
          - docker.kime.lan
          - ai.kime.lan
          - mail.kime.lan
          - sonar.kime.lan
