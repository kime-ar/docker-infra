networks:
  dev-network:
    external: true

services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dev-network

volumes:
  caddy_data:
    name: caddy_data
    external: true
  caddy_config:
    name: caddy_config
    external: true
