include:
  - caddy/docker-compose.yml
  - forgejo/docker-compose.yml
  - homepage/docker-compose.yml
  - n8n/docker-compose.yml
  - uptime-kuma/docker-compose.yml
  - langfuse/docker-compose.yml
  - sonarqube/docker-compose.yml

networks:
  dev-network:
    name: dev-network
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # AOF para no perder escrituras ante un corte (RDB solo snapshotea cada tanto).
    # noeviction: con colas/jobs, una política LRU borraría datos silenciosamente.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      # redis-cli la usa automáticamente; simplifica healthcheck y backups
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/redis:/data
    networks:
      - dev-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definí MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definí MINIO_ROOT_PASSWORD en .env}
      # URLs públicas detrás de Caddy: API en s3.kime.lan, consola en minio.kime.lan
      MINIO_SERVER_URL: https://s3.kime.lan
      MINIO_BROWSER_REDIRECT_URL: https://minio.kime.lan
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/minio:/data
    networks:
      - dev-network

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data/mailpit:/data
    networks:
      - dev-network
