include:
  - caddy/docker-compose.yml
  - forgejo/docker-compose.yml
  - homepage/docker-compose.yml
  - n8n/docker-compose.yml
  - uptime-kuma/docker-compose.yml
  - langfuse/docker-compose.yml
  - sonarqube/docker-compose.yml
  - portainer/docker-compose.yml
  - release-dashboard/docker-compose.yml
  - plane/docker-compose.yml
  - watchtower/docker-compose.yml

# Las tres redes las crea `make up` (target networks) de forma idempotente:
#   edge        - ingress: Caddy y todo servicio que Caddy proxya
#   data        - capa de datos, sin salida a internet (--internal)
#   dev-network - legacy/transición: apps externas de repositories/ -> capa de datos
networks:
  dev-network:
    external: true
  edge:
    external: true
  data:
    external: true

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      # Usadas por init-scripts/02-app-roles.sh SOLO en el primer initdb de una
      # instalación nueva. En instancias existentes correr scripts/migrate-db-roles.sh.
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Definí N8N_DB_PASSWORD en .env}
      LANGFUSE_DB_PASSWORD: ${LANGFUSE_DB_PASSWORD:?Definí LANGFUSE_DB_PASSWORD en .env}
      SONAR_DB_PASSWORD: ${SONAR_DB_PASSWORD:?Definí SONAR_DB_PASSWORD en .env}
      PLANE_DB_PASSWORD: ${PLANE_DB_PASSWORD:?Definí PLANE_DB_PASSWORD en .env}
      N8N_APPS_DB_PASSWORD: ${N8N_APPS_DB_PASSWORD:?Definí N8N_APPS_DB_PASSWORD en .env}
    # Solo localhost del servidor: acceso remoto vía SSH tunnel
    # (ej. desde la Mac: ssh -N -L 5432:127.0.0.1:5432 user@servidor)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - data
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # AOF para no perder escrituras ante un corte (RDB solo snapshotea cada tanto).
    # noeviction: con colas/jobs, una política LRU borraría datos silenciosamente.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      # redis-cli la usa automáticamente; simplifica healthcheck y backups
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Solo localhost: apps en el host (pnpm start:dev) y túneles SSH
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - data
      - dev-network

  minio:
    # Última release con consola admin completa; releases posteriores (CE)
    # recortaron users/policies/settings de la UI.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          memory: 256M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definí MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definí MINIO_ROOT_PASSWORD en .env}
      # URLs públicas detrás de Caddy (Let's Encrypt)
      MINIO_SERVER_URL: https://s3.garatortiz.xyz
      MINIO_BROWSER_REDIRECT_URL: https://minio.garatortiz.xyz
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # API S3 en localhost para SDKs desde el host; consola vía https://minio.garatortiz.xyz
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ./data/minio:/data
    networks:
      - data
      - edge
      - dev-network

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: mailpit
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    # SMTP para apps en el host; UI web vía https://mail.garatortiz.xyz
    ports:
      - "127.0.0.1:1025:1025"
    volumes:
      - ./data/mailpit:/data
    networks:
      - data      # recibe SMTP de las apps
      - edge      # UI web vía Caddy
      - dev-network
