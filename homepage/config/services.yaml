---
- Infraestructura:
    - Portainer:
        href: https://docker.garatortiz.xyz
        icon: portainer.png
        description: Gestión de contenedores Docker
        widget:
          type: portainer
          url: https://portainer:9443
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"

    - Uptime Kuma:
        href: https://status.garatortiz.xyz
        icon: uptime-kuma.png
        description: Monitoreo de disponibilidad
        widget:
          type: uptimekuma
          url: http://uptime-kuma:3001
          slug: "{{HOMEPAGE_VAR_UPTIMEKUMA_SLUG}}"

- Dev & CI:
    - Forgejo:
        href: https://git.garatortiz.xyz
        icon: forgejo.png
        description: Git self-hosted + runners de CI
        server: my-docker
        container: forgejo
        widget:
          type: gitea
          url: http://forgejo:3000
          key: "{{HOMEPAGE_VAR_FORGEJO_TOKEN}}"

    - SonarQube:
        href: https://sonar.garatortiz.xyz
        icon: sonarqube.png
        description: Calidad de código y análisis estático
        ping: sonar.garatortiz.xyz
        server: my-docker
        container: sonarqube_app

    - Release Dashboard:
        href: https://releases.garatortiz.xyz
        icon: mdi-rocket-launch-outline
        description: Catálogo de releases y promoción de kanto
        ping: releases.garatortiz.xyz
        server: my-docker
        container: release-dashboard

