networks:
  edge:
    external: true  # creada por el compose principal
  data:
    external: true

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.27
    depends_on:
      postgres:
        condition: service_healthy
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      # Detrás de Caddy con TLS: cookies seguras y URLs públicas correctas
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1
      - WEBHOOK_URL=https://n8n.kime.lan/
      - N8N_EDITOR_BASE_URL=https://n8n.kime.lan/
      # Conexión al Postgres compartido apuntando al schema aislado de n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=n8n_app
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?Definí N8N_DB_PASSWORD en .env}
      - DB_POSTGRESDB_SCHEMA=n8n
      # Nota: el modo 'queue' se eliminó porque requiere contenedores 'n8n worker'
      # dedicados; sin ellos las ejecuciones de producción quedan encoladas para
      # siempre. En modo regular (default) la instancia principal ejecuta todo.
    volumes:
      - ../data/n8n:/home/node/.n8n
    networks:
      - edge   # Caddy + egress para webhooks y nodos HTTP
      - data   # Postgres
