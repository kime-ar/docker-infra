networks:
  dev-network:
    external: true  # Le dice a Docker que use la red creada por el compose principal

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    container_name: n8n
    restart: unless-stopped
    user: "1000:1000"
    deploy:
      resources:
        limits:
          cpus: '1.0'        # Máximo 1 núcleo de CPU
          memory: 1G         # Máximo 1GB de RAM (evita Out Of Memory)
        reservations:
          cpus: '0.25'       # CPU garantizada
          memory: 512M       # RAM base reservada
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Conexión al Postgres compartido apuntando al schema aislado de n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=postgres
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8nw
      # Conexión a Redis para acelerar ejecuciones y manejar colas
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULLMQ_REDIS_HOST=redis
      - QUEUE_BULLMQ_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dev-network

volumes:
  n8n_data:
    name: n8n_data
    external: true
