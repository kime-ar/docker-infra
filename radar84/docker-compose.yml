networks:
  edge:
    external: true
  data:
    external: true

services:
  radar84:
    build:
      # Relative to this file (radar84/), not docker-infra root:
      #   ../../repositories/radar84 → ~/projects/repositories/radar84
      context: ${RADAR84_REPO_PATH:-../../repositories/radar84}
      dockerfile: Dockerfile
    image: kime/radar84:local
    container_name: radar84
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://n8n_apps:${N8N_APPS_DB_PASSWORD}@postgres:5432/postgres
      - N8N_EXPAND_WEBHOOK_URL=http://n8n:5678/webhook/expand-content
      - RADAR_WEBHOOK_KEY=${RADAR_WEBHOOK_KEY:?Definí RADAR_WEBHOOK_KEY en .env}
    networks:
      - edge
      - data
