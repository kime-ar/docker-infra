networks:
  dev-network:
    external: true

services:
  langfuse-web:
    image: langfuse/langfuse:2
    container_name: langfuse-web
    depends_on:
      - langfuse-worker
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SALT=${SALT}
      
      # Conexión al Postgres compartido (apuntando al schema langfuse)
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?schema=langfuse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      # Desactivar telemetría externa si preferís máxima privacidad
      - TELEMETRY_ENABLED=false
    restart: unless-stopped
    networks:
      - dev-network

  langfuse-worker:
    image: langfuse/langfuse-worker:2
    container_name: langfuse-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?schema=langfuse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
    restart: unless-stopped
    networks:
      - dev-network
