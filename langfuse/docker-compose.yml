networks:
  edge:
    external: true
  data:
    external: true

services:
  langfuse-web:
    image: langfuse/langfuse:2
    container_name: langfuse-web
    depends_on:
      langfuse-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    environment:
      - NODE_ENV=production
      # Con dos redes (edge+data), Next.js standalone se bindea a una sola
      # interfaz; 0.0.0.0 escucha en ambas para que Caddy pueda conectar.
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://ai.garatortiz.xyz}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Definí NEXTAUTH_SECRET en .env}
      - SALT=${SALT:?Definí SALT en .env}
      - DATABASE_URL=postgresql://langfuse_app:${LANGFUSE_DB_PASSWORD:?Definí LANGFUSE_DB_PASSWORD en .env}@postgres:5432/postgres?schema=langfuse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - TELEMETRY_ENABLED=false
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_ACCESS_KEY:?Definí LANGFUSE_S3_ACCESS_KEY en .env}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_SECRET_KEY:?Definí LANGFUSE_S3_SECRET_KEY en .env}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_ACCESS_KEY}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_SECRET_KEY}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=https://s3.garatortiz.xyz
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - edge   # Caddy (ai.garatortiz.xyz) y s3.garatortiz.xyz para media
      - data   # Postgres, Redis, MinIO
      - dev-network

  langfuse-worker:
    image: langfuse/langfuse-worker:2
    container_name: langfuse-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://langfuse_app:${LANGFUSE_DB_PASSWORD:?Definí LANGFUSE_DB_PASSWORD en .env}@postgres:5432/postgres?schema=langfuse
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:?Definí REDIS_PASSWORD en .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_ACCESS_KEY:?Definí LANGFUSE_S3_ACCESS_KEY en .env}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_SECRET_KEY:?Definí LANGFUSE_S3_SECRET_KEY en .env}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_EVENT_UPLOAD_PREFIX=events/
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET:-langfuse}
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=us-east-1
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${LANGFUSE_S3_ACCESS_KEY}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${LANGFUSE_S3_SECRET_KEY}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=https://s3.garatortiz.xyz
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_PREFIX=media/
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3030/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - edge   # s3.garatortiz.xyz (media) y egress
      - data   # Postgres, Redis, MinIO
