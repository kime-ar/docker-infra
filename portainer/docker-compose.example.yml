# Portainer ya corre como contenedor standalone en este host (nombre: portainer)
# y está conectado a dev-network. No incluir en docker-compose.yml para evitar
# conflictos de nombre.
#
# Para instalaciones nuevas sin Portainer existente:
#   docker compose -f portainer/docker-compose.example.yml --env-file .env up -d
#   docker network connect dev-network portainer

networks:
  dev-network:
    external: true

services:
  portainer:
    image: portainer/portainer-ce:2.27.3
    container_name: portainer
    restart: unless-stopped
    volumes:
      - ../data/portainer:/data
      - ${DOCKER_SOCKET}:/var/run/docker.sock
    networks:
      - dev-network
