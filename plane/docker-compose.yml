networks:
  edge:
    external: true
  data:
    external: true

x-db-env: &db-env
  PGHOST: postgres
  PGDATABASE: plane
  POSTGRES_USER: plane_app
  POSTGRES_PASSWORD: ${PLANE_DB_PASSWORD:?Definí PLANE_DB_PASSWORD en .env}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${PLANE_AWS_ACCESS_KEY_ID:-access-key}
  MINIO_ROOT_PASSWORD: ${PLANE_AWS_SECRET_ACCESS_KEY:?Definí PLANE_AWS_SECRET_ACCESS_KEY en .env}

x-aws-s3-env: &aws-s3-env
  AWS_REGION:
  AWS_ACCESS_KEY_ID: ${PLANE_AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${PLANE_AWS_SECRET_ACCESS_KEY:?Definí PLANE_AWS_SECRET_ACCESS_KEY en .env}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-proxy-env: &proxy-env
  APP_DOMAIN: plane.garatortiz.xyz
  FILE_SIZE_LIMIT: 5242880
  LISTEN_HTTP_PORT: 80
  LISTEN_HTTPS_PORT: 443
  BUCKET_NAME: uploads
  SITE_ADDRESS: ":80"

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: ${PLANE_RABBITMQ_PASSWORD:?Definí PLANE_RABBITMQ_PASSWORD en .env}
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-live-env: &live-env
  API_BASE_URL: http://api:8000
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SERVER_SECRET_KEY:?Definí PLANE_LIVE_SERVER_SECRET_KEY en .env}

x-app-env: &app-env
  WEB_URL: https://plane.garatortiz.xyz
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: https://plane.garatortiz.xyz
  GUNICORN_WORKERS: 1
  USE_MINIO: 1
  DATABASE_URL: postgresql://plane_app:${PLANE_DB_PASSWORD}@postgres:5432/plane
  SECRET_KEY: ${PLANE_SECRET_KEY:?Definí PLANE_SECRET_KEY en .env}
  AMQP_URL: amqp://plane:${PLANE_RABBITMQ_PASSWORD}@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: 60/minute
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SERVER_SECRET_KEY}
  WEBHOOK_ALLOWED_IPS:
  WEBHOOK_ALLOWED_HOSTS:

services:
  web:
    image: makeplane/plane-frontend:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    depends_on: [api, worker]

  space:
    image: makeplane/plane-space:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    depends_on: [api, worker, web]

  admin:
    image: makeplane/plane-admin:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    depends_on: [api, web]

  live:
    image: makeplane/plane-live:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment: { <<: [*live-env, *redis-env] }
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    depends_on: [api, web]

  api:
    image: makeplane/plane-backend:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    volumes: ["logs_api:/code/plane/logs"]
    environment: { <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env] }
    networks: [default, data]
    depends_on: [plane-redis, plane-mq]

  worker:
    image: makeplane/plane-backend:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    volumes: ["logs_worker:/code/plane/logs"]
    environment: { <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env] }
    networks: [default, data]
    depends_on: [api, plane-redis, plane-mq]

  beat-worker:
    image: makeplane/plane-backend:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    volumes: ["logs_beat-worker:/code/plane/logs"]
    environment: { <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env] }
    networks: [default, data]
    depends_on: [api, plane-redis, plane-mq]

  migrator:
    image: makeplane/plane-backend:${PLANE_APP_RELEASE:-v1.4.2}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure }
    volumes: ["logs_migrator:/code/plane/logs"]
    environment: { <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env] }
    networks: [default, data]
    depends_on: [plane-redis]

  plane-redis:
    image: valkey/valkey:9.1.2
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    volumes: ["redisdata:/data"]

  plane-mq:
    image: rabbitmq:4.3.2-management-alpine
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    environment: { <<: *mq-env }
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]

  plane-minio:
    image: minio/minio:latest
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    environment: { <<: *minio-env }
    volumes: ["uploads:/export"]

  proxy:
    image: makeplane/plane-proxy:${PLANE_APP_RELEASE:-v1.4.2}
    container_name: plane-proxy
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      replicas: 1
      restart_policy: { condition: any }
    environment: { <<: *proxy-env }
    networks: [default, edge]
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on: [web, api, space, admin, live]

volumes:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
