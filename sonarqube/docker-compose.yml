networks:
  edge:
    external: true
  data:
    external: true
  # Misma red que los jobs del runner: el scanner CI usa
  # SONAR_HOST_URL=http://sonarqube:9000 sin ver Postgres/Redis/MinIO.
  ci-jobs:
    name: ci-jobs
    external: true

services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube_app
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          memory: 1G
    environment:
      SONAR_JDBC_USERNAME: sonar_app
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Definí SONAR_DB_PASSWORD en .env}
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=sonar
      # Heaps explícitos: suman ~2.5G; dejan margen dentro del límite de 3G.
      SONAR_SEARCH_JAVAOPTS: "-Xms512m -Xmx512m"
      SONAR_CE_JAVAOPTS: "-Xms512m -Xmx1g"
      SONAR_WEB_JAVAOPTS: "-Xms256m -Xmx512m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ../data/sonarqube/data:/opt/sonarqube/data
      - ../data/sonarqube/extensions:/opt/sonarqube/extensions
      - ../data/sonarqube/logs:/opt/sonarqube/logs
    networks:
      - edge     # Caddy (sonar.kime.lan) y descarga de plugins
      - data     # Postgres
      - ci-jobs  # sonar-scanner desde Forgejo Actions
    restart: unless-stopped
